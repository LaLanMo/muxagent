name: Desktop Release

on:
  push:
    tags:
      - "desktop/v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Desktop release version (for example 0.1.0 or v0.1.0)"
        required: true
      ref:
        description: "Git ref to release from"
        required: false
        default: "main"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.event_name }}-${{ github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    environment: desktop-release-signing
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
          - target: x86_64-apple-darwin

    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            raw_version="${{ inputs.version }}"
            ref_name="${{ inputs.ref }}"
          else
            raw_version="${GITHUB_REF_NAME}"
            ref_name="${GITHUB_REF}"
          fi

          case "$raw_version" in
            desktop/v*) version="${raw_version#desktop/}" ;;
            desktop/*) version="v${raw_version#desktop/}" ;;
            v*) version="$raw_version" ;;
            *) version="v$raw_version" ;;
          esac

          release_tag="desktop/$version"
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "ref_name=$ref_name" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.meta.outputs.ref_name }}

      - name: Resolve release target SHA
        id: target
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify desktop version matches release tag
        shell: bash
        run: |
          set -euo pipefail

          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/src-tauri/Cargo.toml | head -n 1)"
          if [ -z "$cargo_version" ]; then
            echo "failed to read desktop version from desktop/src-tauri/Cargo.toml" >&2
            exit 1
          fi

          expected_version="${{ steps.meta.outputs.version }}"
          if [ "v$cargo_version" != "$expected_version" ]; then
            echo "desktop version mismatch: Cargo.toml has v$cargo_version but release requested $expected_version" >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1
        with:
          version: 10.18.3

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install desktop dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Run desktop typecheck
        working-directory: desktop
        run: pnpm typecheck

      - name: Import Apple Developer ID certificate
        id: signing
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/muxagent-developer-id.p12"
          keychain_path="$RUNNER_TEMP/muxagent-build.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security default-keychain -s "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"

          signing_identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | grep 'Developer ID Application' \
              | head -n 1 \
              | sed -E 's/.*"([^"]+)".*/\1/'
          )"

          if [ -z "$signing_identity" ]; then
            echo "failed to resolve Developer ID Application signing identity" >&2
            exit 1
          fi

          echo "certificate_path=$certificate_path" >> "$GITHUB_OUTPUT"
          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"
          echo "identity=$signing_identity" >> "$GITHUB_OUTPUT"

      - name: Prepare App Store Connect API key
        id: notary
        shell: bash
        env:
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail

          api_key_path="$RUNNER_TEMP/apple-notary-api-key.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 --decode > "$api_key_path"
          chmod 600 "$api_key_path"

          echo "api_key_path=$api_key_path" >> "$GITHUB_OUTPUT"

      - name: Build desktop bundle
        id: bundle
        shell: bash
        working-directory: desktop
        timeout-minutes: 60
        env:
          APPLE_SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        run: |
          set -euo pipefail

          pnpm tauri build \
            --target "${{ matrix.target }}" \
            --bundles dmg \
            --ci \
            --verbose

          dmg_dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          dmg_path="$(find "$dmg_dir" -maxdepth 1 -name '*.dmg' -print -quit)"
          if [ -z "$dmg_path" ]; then
            echo "failed to find generated DMG in $dmg_dir" >&2
            exit 1
          fi

          echo "dmg_path=desktop/$dmg_path" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple desktop bundle
        id: notarized
        shell: bash
        timeout-minutes: 90
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ steps.notary.outputs.api_key_path }}
        run: |
          set -euo pipefail

          dmg_path="${{ steps.bundle.outputs.dmg_path }}"
          result_path="$RUNNER_TEMP/notary-${{ matrix.target }}.json"

          xcrun notarytool submit "$dmg_path" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 75m \
            --output-format json \
            --no-progress > "$result_path"

          status="$(jq -r '.status // empty' "$result_path")"
          submission_id="$(jq -r '.id // empty' "$result_path")"
          echo "notarization submission '$submission_id' finished with status '$status'"
          if [ "$status" != "Accepted" ]; then
            echo "notarization status was '$status' for submission '$submission_id'" >&2
            if [ -n "$submission_id" ]; then
              xcrun notarytool log "$submission_id" \
                --key "$APPLE_API_KEY_PATH" \
                --key-id "$APPLE_API_KEY" \
                --issuer "$APPLE_API_ISSUER" || true
            fi
            exit 1
          fi

          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"

      - name: Upload desktop bundle
        shell: bash
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.version }}
          RELEASE_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          RELEASE_TARGET: ${{ steps.target.outputs.sha }}
          DMG_PATH: ${{ steps.bundle.outputs.dmg_path }}
        run: |
          set -euo pipefail

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            create_args=(
              "$RELEASE_TAG"
              --title "$RELEASE_NAME"
              --notes "See the assets to download this desktop release."
              --target "$RELEASE_TARGET"
              --draft
            )
            if [ "$RELEASE_PRERELEASE" = "true" ]; then
              create_args+=(--prerelease)
            fi

            gh release create "${create_args[@]}" || gh release view "$RELEASE_TAG" >/dev/null
          fi

          version="${RELEASE_NAME#v}"
          case "${{ matrix.target }}" in
            aarch64-apple-darwin) asset_arch="aarch64" ;;
            x86_64-apple-darwin) asset_arch="x64" ;;
            *)
              echo "unsupported desktop target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac

          asset_name="MuxAgent_${version}_darwin_${asset_arch}.dmg"
          gh release upload "$RELEASE_TAG" "$DMG_PATH#$asset_name" --clobber

      - name: Clean up signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          rm -f "${{ steps.signing.outputs.certificate_path }}"
          rm -f "${{ steps.notary.outputs.api_key_path }}"

          if [ -n "${{ steps.signing.outputs.keychain_path }}" ]; then
            security delete-keychain "${{ steps.signing.outputs.keychain_path }}" || true
          fi
